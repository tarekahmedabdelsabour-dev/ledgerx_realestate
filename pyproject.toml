[project]
name = "ledgerx_realestate"
authors = [{ name = "LedgerX", email = "hello@ledgerx.local" }]
description = "Real estate development: projects, units, pricing, reservations, contracts and installments, brokers, construction and contractors, handover, maintenance, owners association, rentals"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<18.0.0"
erpnext = ">=16.0.0-dev,<18.0.0"

[tool.pytest.ini_options]
testpaths = ["ledgerx_realestate/tests"]
